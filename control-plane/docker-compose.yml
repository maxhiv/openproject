version: "3.8"

services:
  control-plane:
    build: .
    ports:
      - "3100:5000"
    environment:
      RAILS_ENV: development
      PORT: "5000"
      CONTROL_PLANE_DATABASE_URL: postgresql://postgres:postgres@db:5432/control_plane_dev
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-project}
      OPENPROJECT_URL: http://openproject:8080
      OPENPROJECT_API_TOKEN: ${OPENPROJECT_API_TOKEN:-}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dev-secret-key-change-me}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: control_plane_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  pgdata:
  bundle_cache:
