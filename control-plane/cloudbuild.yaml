steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/control-plane:$COMMIT_SHA', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/control-plane:$COMMIT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'control-plane'
      - '--image=gcr.io/$PROJECT_ID/control-plane:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=5000'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=RAILS_ENV=production'
      - '--set-secrets=DATABASE_URL=control-plane-database-url:latest,SECRET_KEY_BASE=control-plane-secret-key:latest,FIREBASE_PROJECT_ID=firebase-project-id:latest,OPENPROJECT_URL=openproject-url:latest,OPENPROJECT_API_TOKEN=openproject-api-token:latest'

  # Run migrations after deploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'control-plane-migrate'
      - '--region=us-central1'
      - '--wait'

images:
  - 'gcr.io/$PROJECT_ID/control-plane:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
